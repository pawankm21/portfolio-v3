<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 445" role="img" aria-labelledby="title desc"><title id="title">How a NAND cell stores charge</title><desc id="desc">A floating gate is insulated above a channel. A strong programming field lets electrons tunnel through the thin oxide; without it, escape is slow.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b64b35" stroke-width="1.4"/></marker></defs><rect width="820" height="445" rx="16" fill="#faf9f3"/><g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="16" fill="#62675c" font-weight="600">01 / A CELL THAT REMEMBERS</text><rect x="28" y="72" width="360" height="48" rx="12" fill="#e9e6dc" stroke="#d6d8cb"/><text x="45" y="102.0" font-size="17" fill="#252821" font-weight="400">Control gate</text><rect x="28" y="130" width="360" height="28" rx="12" fill="#f2eee4" stroke="#d6d8cb"/><text x="45" y="150.0" font-size="17" fill="#252821" font-weight="400">Insulator</text><rect x="28" y="168" width="360" height="72" rx="12" fill="#dce6d6" stroke="#d6d8cb"/><text x="45" y="210.0" font-size="17" fill="#252821" font-weight="400">Floating gate</text><rect x="28" y="250" width="360" height="28" rx="12" fill="#f2eee4" stroke="#d6d8cb"/><text x="45" y="270.0" font-size="17" fill="#252821" font-weight="400">Tunnel oxide</text><rect x="28" y="288" width="360" height="55" rx="12" fill="#e9e6dc" stroke="#d6d8cb"/><text x="45" y="321.5" font-size="17" fill="#252821" font-weight="400">Channel</text><text x="240" y="213" font-size="23" fill="#b64b35" font-weight="600">e⁻</text><text x="280" y="213" font-size="23" fill="#b64b35" font-weight="600">e⁻</text><text x="320" y="213" font-size="23" fill="#b64b35" font-weight="600">e⁻</text><text x="425" y="95" font-size="16" fill="#b64b35" font-weight="600">PROGRAM</text><text x="425" y="125" font-size="17" fill="#252821" font-weight="400">A strong field enables tunnelling.</text><text x="425" y="155" font-size="17" fill="#252821" font-weight="400">Electrons enter the storage region.</text><path d="M345 315 L345 224" fill="none" stroke="#b64b35" stroke-width="2.5" marker-end="url(#arrow)"/><text x="425" y="209" font-size="16" fill="#56734e" font-weight="600">HOLD</text><text x="425" y="239" font-size="17" fill="#252821" font-weight="400">Remove the programming field.</text><text x="425" y="269" font-size="17" fill="#252821" font-weight="400">The barrier greatly slows escape.</text><text x="28" y="389" font-size="15" fill="#62675c" font-weight="400">Conceptual floating-gate cross-section; not to scale.</text><text x="28" y="417" font-size="15" fill="#62675c" font-weight="400">Many 3D cells use localized traps in an insulating layer instead.</text></g></svg>