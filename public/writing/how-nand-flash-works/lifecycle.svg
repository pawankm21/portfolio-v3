<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" role="img" aria-labelledby="title desc"><title id="title">Write, read, update, delete, and reclaim</title><desc id="desc">A file is written to A0 and read through logical address L42. Updating writes B0 and invalidates A0. Deletion and TRIM make B0 unnecessary. Garbage collection preserves other live data and erases entire blocks later.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b64b35" stroke-width="1.4"/></marker></defs><rect width="820" height="680" rx="16" fill="#faf9f3"/><g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="16" fill="#62675c" font-weight="600">03 / ONE FILE, CHANGING PHYSICAL LOCATIONS</text><rect x="25" y="65" width="770" height="96" rx="12" fill="#f1f2e8" stroke="#d6d8cb"/><text x="43" y="93" font-size="14" fill="#b64b35" font-weight="600">WRITE</text><text x="43" y="124" font-size="19" fill="#252821" font-weight="600">L42 → A0</text><text x="420" y="94" font-size="18" fill="#252821" font-weight="400">Hello NAND</text><text x="420" y="120" font-size="14" fill="#62675c" font-weight="400">A0 holds the first version.</text><path d="M400 164 L400 174" fill="none" stroke="#b64b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="177" width="770" height="96" rx="12" fill="#faf9f3" stroke="#d6d8cb"/><text x="43" y="205" font-size="14" fill="#b64b35" font-weight="600">READ</text><text x="43" y="236" font-size="19" fill="#252821" font-weight="600">L42 → A0</text><text x="420" y="206" font-size="18" fill="#252821" font-weight="400">Hello NAND</text><text x="420" y="232" font-size="14" fill="#62675c" font-weight="400">Sense the cell states; charge stays stored.</text><path d="M400 276 L400 286" fill="none" stroke="#b64b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="289" width="770" height="96" rx="12" fill="#f1f2e8" stroke="#d6d8cb"/><text x="43" y="317" font-size="14" fill="#b64b35" font-weight="600">UPDATE</text><text x="43" y="348" font-size="19" fill="#252821" font-weight="600">L42 → B0</text><text x="420" y="318" font-size="18" fill="#252821" font-weight="400">Hello SSD!</text><text x="420" y="344" font-size="14" fill="#62675c" font-weight="400">Write B0; A0 becomes stale.</text><path d="M400 388 L400 398" fill="none" stroke="#b64b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="401" width="770" height="96" rx="12" fill="#faf9f3" stroke="#d6d8cb"/><text x="43" y="429" font-size="14" fill="#b64b35" font-weight="600">DELETE + TRIM</text><text x="43" y="460" font-size="19" fill="#252821" font-weight="600">L42 no longer needed</text><text x="420" y="430" font-size="18" fill="#252821" font-weight="400">B0 invalid</text><text x="420" y="456" font-size="14" fill="#62675c" font-weight="400">No immediate block erase is required.</text><path d="M400 500 L400 510" fill="none" stroke="#b64b35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="513" width="770" height="96" rx="12" fill="#f1f2e8" stroke="#d6d8cb"/><text x="43" y="541" font-size="14" fill="#b64b35" font-weight="600">GARBAGE COLLECT</text><text x="43" y="572" font-size="19" fill="#252821" font-weight="600">Preserve other live pages</text><text x="420" y="542" font-size="18" fill="#252821" font-weight="400">Erase whole block</text><text x="420" y="568" font-size="14" fill="#62675c" font-weight="400">Reclaim A0 and B0 when their blocks are</text><text x="420" y="587" font-size="14" fill="#62675c" font-weight="400">erased.</text><text x="28" y="654" font-size="15" fill="#62675c" font-weight="400">L42 is a toy logical address. A0 and B0 are pages in different erase blocks.</text></g></svg>