<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 475" role="img" aria-labelledby="title desc"><title id="title">SLC and TLC threshold ranges</title><desc id="desc">An SLC read voltage separates erased and programmed distributions. TLC distinguishes eight threshold ranges to encode three bits. Shapes and spacing are schematic.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b64b35" stroke-width="1.4"/></marker></defs><rect width="820" height="475" rx="16" fill="#faf9f3"/><g font-family="system-ui, sans-serif"><text x="28" y="37" font-size="16" fill="#62675c" font-weight="600">02 / READ THE THRESHOLD, NOT THE ELECTRONS</text><text x="28" y="76" font-size="20" fill="#252821" font-weight="600">SLC: two threshold ranges</text><path d="M45 195 H770" stroke="#62675c" stroke-width="2"/><path d="M105 194 C120 194 123 106 159 106 C195 106 198 194 215 194" fill="#dce6d6" stroke="#6c8960" stroke-width="2"/><path d="M540 194 C555 194 558 106 594 106 C630 106 633 194 650 194" fill="#ecd8cf" stroke="#b64b35" stroke-width="2"/><path d="M390 90 V205" stroke="#252821" stroke-width="2" stroke-dasharray="5 6"/><text x="320" y="80" font-size="16" fill="#252821" font-weight="400">Read voltage</text><text x="81" y="231" font-size="18" fill="#252821" font-weight="400">Erased → 1</text><text x="525" y="231" font-size="18" fill="#252821" font-weight="400">Programmed → 0</text><text x="76" y="258" font-size="16" fill="#62675c" font-weight="400">Conducts at Vread</text><text x="521" y="258" font-size="16" fill="#62675c" font-weight="400">Does not conduct</text><text x="460" y="293" font-size="16" fill="#62675c" font-weight="400">Threshold voltage →</text><text x="28" y="340" font-size="20" fill="#252821" font-weight="600">TLC: eight ranges encode three bits per cell</text><rect x="50" y="365" width="68" height="43" rx="12" fill="#dce6d6" stroke="#d6d8cb"/><text x="73" y="394" font-size="18" fill="#252821" font-weight="400">0</text><rect x="141" y="365" width="68" height="43" rx="12" fill="#e9e6dc" stroke="#d6d8cb"/><text x="164" y="394" font-size="18" fill="#252821" font-weight="400">1</text><rect x="232" y="365" width="68" height="43" rx="12" fill="#dce6d6" stroke="#d6d8cb"/><text x="255" y="394" font-size="18" fill="#252821" font-weight="400">2</text><rect x="323" y="365" width="68" height="43" rx="12" fill="#e9e6dc" stroke="#d6d8cb"/><text x="346" y="394" font-size="18" fill="#252821" font-weight="400">3</text><rect x="414" y="365" width="68" height="43" rx="12" fill="#dce6d6" stroke="#d6d8cb"/><text x="437" y="394" font-size="18" fill="#252821" font-weight="400">4</text><rect x="505" y="365" width="68" height="43" rx="12" fill="#e9e6dc" stroke="#d6d8cb"/><text x="528" y="394" font-size="18" fill="#252821" font-weight="400">5</text><rect x="596" y="365" width="68" height="43" rx="12" fill="#dce6d6" stroke="#d6d8cb"/><text x="619" y="394" font-size="18" fill="#252821" font-weight="400">6</text><rect x="687" y="365" width="68" height="43" rx="12" fill="#e9e6dc" stroke="#d6d8cb"/><text x="710" y="394" font-size="18" fill="#252821" font-weight="400">7</text><text x="28" y="444" font-size="16" fill="#62675c" font-weight="400">Range indices shown, not bit assignments. More ranges = tighter margins.</text></g></svg>