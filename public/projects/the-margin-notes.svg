<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">The Margin Notes cover</title><desc id="desc">An editorial cover with the portfolio wordmark, serif typography, and a red looping line on cream paper.</desc><rect width="960" height="600" fill="#f3f0e6"/><g fill="#252821"><text x="60" y="80" font-family="Arial,sans-serif" font-size="38" font-weight="700">pawan <tspan fill="#b64b35">/</tspan></text><path d="M60 115H900" stroke="#cfcec1"/><text x="60" y="191" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">DESIGN · CODE · CURIOSITY</text><text x="55" y="292" font-family="Georgia,serif" font-size="80">The Margin</text><text x="55" y="385" font-family="Georgia,serif" font-size="90" font-style="italic">Notes<tspan fill="#b64b35">.</tspan></text><text x="60" y="468" font-family="Arial,sans-serif" font-size="22" fill="#62675c">A personal portfolio, with room for the rest.</text><path d="M60 520H900" stroke="#cfcec1"/><text x="60" y="555" font-family="Arial,sans-serif" font-size="14" fill="#62675c" letter-spacing="2">NEXT.JS / TYPESCRIPT / MDX</text></g><path d="M724 178C623 211 827 257 788 328S664 369 721 317S916 394 819 462" fill="none" stroke="#b64b35" stroke-width="3"/><path d="M813 447L819 463L838 458" fill="none" stroke="#b64b35" stroke-width="3"/></svg>
